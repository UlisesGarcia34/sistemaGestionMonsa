<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MGC | Sistema de gestion</title>
    <script>
      // Aplica el tema antes del primer paint (evita el flash de tema
      // incorrecto que se veria si esto se hiciera desde un useEffect de
      // React, que corre despues de montar). Misma clave que lib/theme.tsx.
      (function () {
        var guardado = localStorage.getItem("mgc.tema");
        var oscuro =
          guardado === "oscuro" ||
          (!guardado && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (oscuro) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
